<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050706" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Coming Soon</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #050706;
        --text: #f4f7f5;
        --muted: #7e8781;
        --green: #8df4b4;
        --green-bright: #c1ffd7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 46%, rgba(71, 130, 91, 0.06), transparent 32rem),
          var(--background);
        color: var(--text);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      main {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      .hero {
        position: relative;
        display: grid;
        place-items: center;
        width: min(72vw, 32rem);
        aspect-ratio: 1;
        text-align: center;
      }

      .ring,
      .ring::before,
      .ring::after {
        position: absolute;
        inset: 0;
        border-radius: 50%;
      }

      .ring {
        background: conic-gradient(
          from 225deg,
          transparent 0deg 43deg,
          rgba(141, 244, 180, 0.14) 76deg,
          var(--green) 145deg,
          var(--green-bright) 184deg,
          var(--green) 222deg,
          rgba(141, 244, 180, 0.14) 292deg,
          transparent 325deg 360deg
        );
        filter: drop-shadow(0 0 0.7rem rgba(110, 240, 159, 0.34));
        animation: orbit 9s linear infinite;
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
      }

      .ring::before {
        content: "";
        background: conic-gradient(
          from 215deg,
          transparent 0deg 64deg,
          rgba(141, 244, 180, 0.45) 145deg,
          var(--green-bright) 180deg,
          rgba(141, 244, 180, 0.45) 215deg,
          transparent 296deg 360deg
        );
        filter: blur(0.3rem);
      }

      .ring::after {
        content: "";
        inset: 1px;
        border: 1px solid rgba(113, 178, 136, 0.09);
      }

      .copy {
        position: relative;
        z-index: 1;
        transform: translateY(0.15rem);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 2.65rem);
        font-weight: 400;
        letter-spacing: 0.22em;
        line-height: 1.1;
        text-indent: 0.22em;
      }

      p {
        margin: 1.15rem 0 0;
        color: var(--muted);
        font-size: clamp(0.58rem, 1.35vw, 0.72rem);
        font-weight: 500;
        letter-spacing: 0.28em;
        line-height: 1.5;
        text-indent: 0.28em;
      }

      @keyframes orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 420px) {
        .hero {
          width: min(80vw, 24rem);
        }

        h1 {
          letter-spacing: 0.17em;
          text-indent: 0.17em;
        }

        p {
          max-width: 15rem;
          letter-spacing: 0.2em;
          text-indent: 0.2em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="ring" aria-hidden="true"></div>
        <div class="copy">
          <h1 id="page-title">COMING SOON</h1>
          <p>SOMETHING NEW ON THE WAY</p>
        </div>
      </section>
    </main>
  </body>
</html>
